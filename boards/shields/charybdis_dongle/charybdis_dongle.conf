## Split keyboards
## https://zmk.dev/docs/config/system#split-keyboards
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

## Display Configuratoin
## https://zmk.dev/docs/config/displays
# CONFIG_ZMK_DISPLAY=n

# ## Track words per minute
# CONFIG_ZMK_WPM=y


## Input subsystem needed for input processor chain on the dongle central
CONFIG_INPUT=y

## Both halves reconnect at the same time after sleep. With 5 ATT request slots
## (ZMK v0.3.0 default) the GATT discovery for one half can fail with -ENOMEM:
## that half connects but its keys do not work. Upstream fix: zmkfirmware/zmk#3216
## (issue #3156). On Zephyr 3.5 the ATT request slots follow this setting.
CONFIG_BT_L2CAP_TX_BUF_COUNT=10